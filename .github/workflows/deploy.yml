# Builds Amanat and deploys it to Cloudflare Pages (project "amanat").
# Needs GitHub repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN (required), and FIREBASE_SERVICE_ACCOUNT, GEMINI_API_KEY,
#   which are copied into Cloudflare's encrypted secret store on each run.
name: Deploy
on:
  push:
    branches: [main, claude/vibrant-lamport-73cbm9]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check token
        id: tok
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::warning::Add the CLOUDFLARE_API_TOKEN repo secret to deploy."; echo "skip=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.tok.outputs.skip != '1'
        with: { node-version: 22, cache: npm }
      - name: Build
        if: steps.tok.outputs.skip != '1'
        run: npm ci && npm run build
      - name: Cloudflare project and KV
        if: steps.tok.outputs.skip != '1'
        run: |
          set -e
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          [ "$ACC" = "null" ] && { echo "Token cannot list accounts"; exit 1; }
          echo "::add-mask::$ACC"; echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV
          export CLOUDFLARE_ACCOUNT_ID=$ACC
          KV=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="amanat") | .id')
          if [ -z "$KV" ]; then npx wrangler kv namespace create amanat >/dev/null; KV=$(npx wrangler kv namespace list | jq -r '.[] | select(.title=="amanat") | .id'); fi
          npx wrangler pages project create amanat --production-branch main 2>&1 | tail -2 || true
          printf 'name = "amanat"\npages_build_output_dir = "dist"\ncompatibility_date = "2025-09-01"\n\n[[kv_namespaces]]\nbinding = "AMANAT_KV"\nid = "%s"\n' "$KV" > wrangler.toml
      - name: Copy secrets to Cloudflare
        if: steps.tok.outputs.skip != '1'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          for k in FIREBASE_SERVICE_ACCOUNT GEMINI_API_KEY; do
            v="${!k}"; [ -z "$v" ] && { echo "$k not set, skipped"; continue; }
            printf '%s' "$v" | npx wrangler pages secret put "$k" --project-name amanat >/dev/null && echo "set $k"
          done
      - name: Deploy
        if: steps.tok.outputs.skip != '1'
        run: npx wrangler pages deploy dist --project-name amanat --branch main --commit-dirty=true
      - name: Custom domain
        if: steps.tok.outputs.skip != '1'
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/amanat/domains
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for d in fazol.skin fazool.skin; do echo "NS $d: $(dig +short NS $d | tr '\n' ' ')"; done
          ROOT=""; for d in fazol.skin fazool.skin; do [ -n "$(dig +short NS $d)" ] && { ROOT=$d; break; }; done
          [ -z "$ROOT" ] && { echo "::warning::Neither fazol.skin nor fazool.skin resolves"; exit 0; }
          WANT="amanat.$ROOT"; echo "Using $WANT"
          for d in $(curl -s -H "$H" $API | jq -r '.result[].name'); do
            [ "$d" != "$WANT" ] && curl -s -X DELETE -H "$H" "$API/$d" >/dev/null && echo "removed $d"
          done
          curl -s -X POST -H "$H" -H 'content-type: application/json' $API -d "{\"name\":\"$WANT\"}" | jq -c '{success, errors}'
          curl -s -H "$H" $API | jq -c '.result[] | {name, status, validation: .validation_data.status}'
          echo "DNS now for $WANT: $(dig +short $WANT | tr '\n' ' ')"
          echo "CNAME at Namecheap: $(dig +short CNAME $WANT @dns1.registrar-servers.com | tr '\n' ' ')"
          echo "All records at Namecheap for $WANT: $(dig +short ANY $WANT @dns1.registrar-servers.com | tr '\n' ' ')"
          # Ask Cloudflare to re-check the domain until it is active (certificate issued), up to ~8 minutes.
          for i in $(seq 1 16); do
            st=$(curl -s -H "$H" "$API/$WANT" | jq -r '.result.status')
            echo "try $i: status $st, https $(curl -s -o /dev/null -w '%{http_code}' -m 10 https://$WANT/)"
            [ "$st" = "active" ] && break
            curl -s -X PATCH -H "$H" "$API/$WANT" >/dev/null
            sleep 30
          done
      - name: Smoke test live site
        if: steps.tok.outputs.skip != '1'
        run: |
          SITE=https://$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/amanat | jq -r '.result.subdomain')
          sleep 10
          echo "Site: $SITE"
          echo "home: $(curl -s -o /dev/null -w '%{http_code}' $SITE/)"
          echo "sw: $(curl -s -o /dev/null -w '%{http_code}' $SITE/sw.js)"
          echo "setup: $(curl -s $SITE/api/setup)"
